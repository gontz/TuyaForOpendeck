<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../_shared/style.css">
    <script src="../_shared/sdpi-components.js"></script>
    <script src="../_shared/settingsBinding.js"></script>
    <script src="../_shared/tuyaDevicePicker.js"></script>
</head>
<body>

<div class="field">
    <label>Device Source</label>
    <select id="deviceSource">
        <option value="global">Use Global Default Devices</option>
        <option value="local">Use Devices Below</option>
    </select>
</div>

<div class="field">
    <label>Devices</label>
    <div id="picker"></div>
</div>

<hr>

<div class="field">
    <label>Brightness (%)</label>
    <div class="range-wrap">
        <input type="range" id="brightness" min="0" max="100" step="1">
        <span class="range-value" id="brightnessVal">0</span>
    </div>
</div>

<script>
window.addEventListener('load', function () {
    TuyaSettings.bind('deviceSource', 'devices.useGlobalSettingsOption', { defaultValue: 'global' });
    TuyaSettings.bind('brightness', 'brightness', { defaultValue: 50, valueDisplay: 'brightnessVal' });
    TuyaSettings.init();

    tuyaDevicePicker('picker', 'devices.deviceSlugListString', {
        useGlobalPath: 'devices.useGlobalSettingsOption',
        globalSettingPath: 'defaultDevices.deviceSlugListString',
        readOnlyWhenGlobal: true
    });
});
</script>
</body>
</html>
