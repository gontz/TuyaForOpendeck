<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi-v2@latest/src/sdpi.css">
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
    <script src="../_shared/tuyaDevicePicker.js"></script>
</head>
<body>
<div class="sdpi-wrapper">
    <sdpi-item label="Use Global Default Devices">
        <sdpi-select setting="devices.useGlobalSettingsOption">
            <option value="global">Use Global Default Devices</option>
            <option value="local">Use Devices Below</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Devices">
        <div id="picker" style="width: 100%"></div>
    </sdpi-item>

    <sdpi-item label="Brightness (%)">
        <sdpi-range setting="brightness" min="0" max="100" step="1" showlabels></sdpi-range>
    </sdpi-item>

</div>
<script>
window.addEventListener('load', () => {
    tuyaDevicePicker('picker', 'devices.deviceSlugListString', {
        useGlobalPath: 'devices.useGlobalSettingsOption',
        globalSettingPath: 'defaultDevices.deviceSlugListString',
        readOnlyWhenGlobal: true
    });
});
</script>
</body>
</html>
