<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <title>Tuya Light Controller - Global Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi-v2@latest/src/sdpi.css">
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
    <script src="../_shared/tuyaDevicePicker.js"></script>
</head>
<body>
<div class="sdpi-wrapper">
    <sdpi-item label="API URL">
        <sdpi-textfield id="apiUrlField" setting="apiUrl" placeholder="http://localhost:5000"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="API Token">
        <sdpi-password id="apiTokenField" setting="apiToken" placeholder="Authorization header, raw"></sdpi-password>
    </sdpi-item>
    <sdpi-item label="Default Devices">
        <div id="picker" style="width: 100%"></div>
    </sdpi-item>
    <sdpi-item label="Test Connection">
        <sdpi-button id="testBtn">Ping /devices</sdpi-button>
    </sdpi-item>
    <sdpi-item label="Status">
        <div id="testResult" style="font-size:11px;opacity:.8"></div>
    </sdpi-item>
</div>
<script>
window.addEventListener('load', () => {
    const STORAGE_KEY = 'tuyaPluginGlobalSettings';

    const persistGlobalLocally = async () => {
        const s = await SDPIComponents.streamDeckClient.getSettings();
        const settings = (s && s.settings) ? s.settings : s;
        const payload = {
            apiUrl: (settings && settings.apiUrl) || '',
            apiToken: (settings && settings.apiToken) || ''
        };
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    };

    const refreshPicker = async () => {
        await persistGlobalLocally();
        tuyaDevicePicker('picker', 'defaultDevices.deviceSlugListString', {
            preferLocal: true,
            apiUrlPath: 'apiUrl',
            apiTokenPath: 'apiToken'
        });
    };

    refreshPicker();

    for (const id of ['apiUrlField', 'apiTokenField']) {
        const el = document.getElementById(id);
        if (!el) continue;
        el.addEventListener('change', () => setTimeout(refreshPicker, 150));
        el.addEventListener('blur', () => setTimeout(refreshPicker, 150), true);
    }

    document.getElementById('testBtn').addEventListener('click', async () => {
        const result = document.getElementById('testResult');
        result.textContent = 'Pinging...';
        const s = await SDPIComponents.streamDeckClient.getSettings();
        const settings = (s && s.settings) ? s.settings : s;
        const apiUrl = (settings && settings.apiUrl) || '';
        const apiToken = (settings && settings.apiToken) || '';
        try {
            const res = await fetch(apiUrl.replace(/\/$/, '') + '/devices', { headers: { Authorization: apiToken } });
            if (!res.ok) { result.textContent = 'HTTP ' + res.status; return; }
            const j = await res.json();
            const n = (Object.keys(j.switches || {}).length) + (Object.keys(j.lights || {}).length);
            result.textContent = 'OK - ' + n + ' device(s) reported';
            await persistGlobalLocally();
            setTimeout(refreshPicker, 50);
        } catch (e) {
            result.textContent = 'Error - ' + e.message;
        }
    });
});
</script>
</body>
</html>
